# POST répétés sur les pages de connexion / mot de passe oublié / 2FA (Admin, Partenaire).
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "POST /(admin|partenaire)/(login|password-reset|securite)[^"]*" (200|302|419|422|429) \d+
            ^<HOST> \S+ \S+ \[\] "POST /livewire/update[^"]*" 419 \d+
ignoreregex =
