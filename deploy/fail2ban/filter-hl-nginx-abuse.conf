# Rafales de 403/404/429/444 (scans, énumération, dépassement de débit).
# Les requêtes automatiques des navigateurs (favicon, apple-touch-icon, manifest, .well-known) sont ignorées :
# Safari/iOS les émet à chaque page et un simple visiteur dépasserait sinon le seuil.
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ [^"]*" (403|404|429|444) \d+
ignoreregex = "(GET|HEAD) /(favicon[^ ]*\.(ico|png)|apple-touch-icon[^ ]*\.png|robots\.txt|sitemap[^ ]*\.xml|manifest\.(json|webmanifest)|site\.webmanifest|browserconfig\.xml|\.well-known/|build/|storage/)
