# Bannissement applicatif : ajoute `deny <ip>;` dans un fichier inclus par Nginx puis recharge.
[Definition]
actionstart = touch /etc/nginx/conf.d/hl-banned.conf
actionstop  =
actioncheck =
actionban   = grep -q "deny <ip>;" /etc/nginx/conf.d/hl-banned.conf || { echo "deny <ip>;" >> /etc/nginx/conf.d/hl-banned.conf && nginx -t -q && systemctl reload nginx; }
actionunban = sed -i "/^deny <ip>;$/d" /etc/nginx/conf.d/hl-banned.conf && nginx -t -q && systemctl reload nginx
