# Authenticated Origin Pulls : seul Cloudflare (certificat client signé par sa CA) peut établir une connexion TLS.
# À inclure dans le bloc server{} du vhost UNIQUEMENT une fois le site proxifié par Cloudflare (sinon tout accès direct échoue, y compris Certbot).
# CA : https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/zone-level/
ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
